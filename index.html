<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kana Pocket</title>
<meta name="description" content="Hiragana & katakana chart, quizzes and travel phrases — works offline.">
<meta name="theme-color" content="#f7eeef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kana Pocket">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;family=Klee+One:wght@400;600&amp;family=Shippori+Mincho:wght@500&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#fbf7f6}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;color:#3b2b30;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{touch-action:manipulation}
a{color:#b44d66}a:hover{color:#8f3a50}
#app{height:100%}
.sidebar{padding-top:max(32px,env(safe-area-inset-top))!important;padding-bottom:max(24px,env(safe-area-inset-bottom))!important}
/* Narrow main area (phones, iPad portrait): show the selected character above the chart */
@media (max-width:1099px){
  .selpanel{order:-1;flex:1 1 100%!important;flex-direction:row!important;flex-wrap:wrap;justify-content:flex-start;align-items:center!important;padding:14px 18px!important;gap:14px 18px!important;top:0!important;z-index:2;box-shadow:0 4px 14px rgba(80,40,50,.08)}
  .selpanel.empty{display:none!important}
  .selpanel .selch{font-size:64px!important}
  .selpanel .selinfo{display:flex!important;flex-direction:column;align-items:flex-start;gap:2px}
  .selpanel .selinfo>div{align-items:flex-start!important}
  .selpanel .selbtns{width:auto!important;margin-left:auto}
  .selpanel .selbtns button{padding:0 16px}
}
/* Phones: sidebar becomes a bottom tab bar */
@media (max-width:700px){
  .shell{flex-direction:column-reverse}
  .sidebar{width:100%!important;flex-direction:row!important;padding:6px 8px max(6px,env(safe-area-inset-bottom))!important;border-right:none!important;border-top:1px solid #eee1e3;gap:0!important}
  .sidebar .brand,.sidebar .foot{display:none!important}
  .sidebar .navlist{flex-direction:row!important;flex:1;justify-content:space-around}
  .sidebar .navlist button{flex:1;flex-direction:column;justify-content:center;gap:4px!important;font-size:12px!important;padding:6px!important;min-height:0!important}
  .page{padding:max(20px,env(safe-area-inset-top)) 16px 32px!important;gap:20px!important}
  .page h1{font-size:28px!important}
  .chartgrid{gap:6px!important}
  .chartgrid>div{gap:6px!important}
  .chartgrid>div>div:first-child{width:14px!important}
  .chartgrid button{height:72px!important;border-radius:14px!important}
  .chartgrid button>span:first-child{font-size:30px!important}
  .selpanel .selbtns{flex-direction:row!important;width:100%!important;margin-left:0}
  .selpanel .selbtns button{flex:1}
  .quizcard{padding:20px 16px!important;gap:20px!important;border-radius:24px!important}
  .quizcard .prompt{font-size:104px!important}
  .write-wrap{flex-direction:column;align-items:center!important}
  .write-tools{flex-direction:row!important}
  .write-pad,.write-pad canvas{width:min(300px,calc(100vw - 68px))!important;height:min(300px,calc(100vw - 68px))!important}
  .write-pad .ghost{font-size:min(210px,calc((100vw - 68px) * .7))!important}
  .phrase{padding:16px!important;gap:12px!important}
  .phrase .phrow{align-items:flex-start!important;gap:12px!important}
  .replies{padding:8px 8px 8px 12px!important}
  .phrase .jp{font-size:22px!important}
  .phrase .phbtns{display:flex!important;flex-direction:column;gap:8px;align-self:flex-start}
  .phrase .phbtns button{width:44px!important;height:44px!important}
  .cats{flex-wrap:nowrap!important;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .cats::-webkit-scrollbar{display:none}
  .cats button{flex-shrink:0;white-space:nowrap}
  .donebtns{flex-direction:column;width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
